<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f0c29"/>
      <stop offset="50%" style="stop-color:#302b63"/>
      <stop offset="100%" style="stop-color:#24243e"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#00d2ff"/>
      <stop offset="100%" style="stop-color:#7b2ff7"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1200" height="400" fill="url(#bg)"/>
  <!-- Grid pattern -->
  <g opacity="0.06" stroke="white" stroke-width="0.5">
    <line x1="0" y1="50" x2="1200" y2="50"/><line x1="0" y1="100" x2="1200" y2="100"/>
    <line x1="0" y1="150" x2="1200" y2="150"/><line x1="0" y1="200" x2="1200" y2="200"/>
    <line x1="0" y1="250" x2="1200" y2="250"/><line x1="0" y1="300" x2="1200" y2="300"/>
    <line x1="0" y1="350" x2="1200" y2="350"/>
    <line x1="100" y1="0" x2="100" y2="400"/><line x1="200" y1="0" x2="200" y2="400"/>
    <line x1="300" y1="0" x2="300" y2="400"/><line x1="400" y1="0" x2="400" y2="400"/>
    <line x1="500" y1="0" x2="500" y2="400"/><line x1="600" y1="0" x2="600" y2="400"/>
    <line x1="700" y1="0" x2="700" y2="400"/><line x1="800" y1="0" x2="800" y2="400"/>
    <line x1="900" y1="0" x2="900" y2="400"/><line x1="1000" y1="0" x2="1000" y2="400"/>
    <line x1="1100" y1="0" x2="1100" y2="400"/>
  </g>
  <!-- Decorative circles -->
  <circle cx="150" cy="320" r="60" fill="none" stroke="url(#accent)" stroke-width="1.5" opacity="0.3"/>
  <circle cx="150" cy="320" r="40" fill="none" stroke="url(#accent)" stroke-width="1" opacity="0.2"/>
  <circle cx="1050" cy="80" r="80" fill="none" stroke="url(#accent)" stroke-width="1.5" opacity="0.2"/>
  <circle cx="1050" cy="80" r="50" fill="none" stroke="url(#accent)" stroke-width="1" opacity="0.15"/>
  <!-- Dots -->
  <g fill="#00d2ff" opacity="0.15">
    <circle cx="300" cy="80" r="3"/><circle cx="500" cy="120" r="2"/><circle cx="700" cy="60" r="3"/>
    <circle cx="900" cy="140" r="2"/><circle cx="400" cy="340" r="3"/><circle cx="800" cy="300" r="2"/>
  </g>
  <!-- Icon: document -->
  <g transform="translate(120, 110)" filter="url(#glow)">
    <rect x="0" y="0" width="80" height="100" rx="6" fill="none" stroke="#00d2ff" stroke-width="2.5" opacity="0.8"/>
    <line x1="20" y1="30" x2="60" y2="30" stroke="#00d2ff" stroke-width="2" opacity="0.6"/>
    <line x1="20" y1="45" x2="55" y2="45" stroke="#00d2ff" stroke-width="2" opacity="0.6"/>
    <line x1="20" y1="60" x2="50" y2="60" stroke="#00d2ff" stroke-width="2" opacity="0.6"/>
    <line x1="20" y1="75" x2="45" y2="75" stroke="#00d2ff" stroke-width="2" opacity="0.6"/>
  </g>
  <!-- Arrow -->
  <g filter="url(#glow)" opacity="0.7">
    <line x1="230" y1="160" x2="310" y2="160" stroke="url(#accent)" stroke-width="2.5"/>
    <polygon points="310,152 330,160 310,168" fill="url(#accent)"/>
  </g>
  <!-- Icon: brain/AI -->
  <g transform="translate(350, 110)" filter="url(#glow)">
    <circle cx="40" cy="50" r="35" fill="none" stroke="#7b2ff7" stroke-width="2.5" opacity="0.8"/>
    <path d="M25,40 Q30,25 40,30 Q50,25 55,40" fill="none" stroke="#7b2ff7" stroke-width="2" opacity="0.6"/>
    <path d="M25,55 Q30,70 40,65 Q50,70 55,55" fill="none" stroke="#7b2ff7" stroke-width="2" opacity="0.6"/>
    <circle cx="33" cy="45" r="3" fill="#7b2ff7" opacity="0.7"/>
    <circle cx="47" cy="45" r="3" fill="#7b2ff7" opacity="0.7"/>
  </g>
  <!-- Arrow -->
  <g filter="url(#glow)" opacity="0.7">
    <line x1="430" y1="160" x2="510" y2="160" stroke="url(#accent)" stroke-width="2.5"/>
    <polygon points="510,152 530,160 510,168" fill="url(#accent)"/>
  </g>
  <!-- Icon: questions/chat -->
  <g transform="translate(550, 110)" filter="url(#glow)">
    <rect x="0" y="5" width="90" height="70" rx="10" fill="none" stroke="#00d2ff" stroke-width="2.5" opacity="0.8"/>
    <polygon points="20,75 35,75 25,95" fill="none" stroke="#00d2ff" stroke-width="2.5" opacity="0.8"/>
    <text x="45" y="42" text-anchor="middle" fill="#00d2ff" font-size="24" font-family="monospace" opacity="0.9">?!</text>
  </g>
  <!-- Main title -->
  <text x="750" y="145" text-anchor="middle" fill="white" font-size="48" font-family="system-ui, -apple-system, sans-serif" font-weight="800" filter="url(#glow)">
    Resume
  </text>
  <text x="750" y="200" text-anchor="middle" fill="url(#accent)" font-size="48" font-family="system-ui, -apple-system, sans-serif" font-weight="800" filter="url(#glow)">
    Interviewer
  </text>
  <!-- Subtitle -->
  <text x="750" y="250" text-anchor="middle" fill="white" font-size="18" font-family="system-ui, -apple-system, sans-serif" opacity="0.7">
    AI-Powered Interview Question Generator
  </text>
  <!-- Tag line -->
  <g transform="translate(750, 280)">
    <rect x="-180" y="-15" width="360" height="30" rx="15" fill="url(#accent)" opacity="0.15"/>
    <text x="0" y="5" text-anchor="middle" fill="url(#accent)" font-size="14" font-family="system-ui, -apple-system, sans-serif" font-weight="600">
      Feed a resume. Get real interview questions.
    </text>
  </g>
  <!-- Decorative bottom line -->
  <rect x="0" y="392" width="1200" height="8" fill="url(#accent)" opacity="0.6"/>
</svg>
