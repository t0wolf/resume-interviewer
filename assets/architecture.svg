<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 320">
  <defs>
    <linearGradient id="g1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#667eea"/><stop offset="100%" style="stop-color:#764ba2"/>
    </linearGradient>
    <linearGradient id="g2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00d2ff"/><stop offset="100%" style="stop-color:#3a7bd5"/>
    </linearGradient>
    <linearGradient id="g3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f857a6"/><stop offset="100%" style="stop-color:#ff5858"/>
    </linearGradient>
    <linearGradient id="g4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#11998e"/><stop offset="100%" style="stop-color:#38ef7d"/>
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#000" flood-opacity="0.3"/>
    </filter>
  </defs>
  <rect width="900" height="320" fill="#1a1a2e" rx="12"/>
  <!-- Step 1: Parse -->
  <g filter="url(#shadow)">
    <rect x="30" y="80" width="160" height="160" rx="12" fill="#16213e" stroke="#667eea" stroke-width="2"/>
    <rect x="30" y="80" width="160" height="36" rx="12" fill="url(#g1)"/>
    <rect x="30" y="104" width="160" height="12" fill="url(#g1)"/>
    <text x="110" y="105" text-anchor="middle" fill="white" font-size="14" font-weight="700" font-family="system-ui">Parse Resume</text>
    <text x="110" y="145" text-anchor="middle" fill="#a0a0c0" font-size="12" font-family="monospace">.docx .pdf .txt</text>
    <text x="110" y="170" text-anchor="middle" fill="#a0a0c0" font-size="12" font-family="monospace">Education</text>
    <text x="110" y="190" text-anchor="middle" fill="#a0a0c0" font-size="12" font-family="monospace">Experience</text>
    <text x="110" y="210" text-anchor="middle" fill="#a0a0c0" font-size="12" font-family="monospace">Projects</text>
    <text x="110" y="230" text-anchor="middle" fill="#a0a0c0" font-size="12" font-family="monospace">Skills</text>
  </g>
  <!-- Arrow 1 -->
  <g>
    <line x1="200" y1="160" x2="250" y2="160" stroke="#667eea" stroke-width="2" stroke-dasharray="6,4"/>
    <polygon points="250,154 262,160 250,166" fill="#667eea"/>
  </g>
  <!-- Step 2: Signal -->
  <g filter="url(#shadow)">
    <rect x="270" y="80" width="160" height="160" rx="12" fill="#16213e" stroke="#3a7bd5" stroke-width="2"/>
    <rect x="270" y="80" width="160" height="36" rx="12" fill="url(#g2)"/>
    <rect x="270" y="104" width="160" height="12" fill="url(#g2)"/>
    <text x="350" y="105" text-anchor="middle" fill="white" font-size="14" font-weight="700" font-family="system-ui">Extract Signals</text>
    <text x="350" y="145" text-anchor="middle" fill="#a0a0c0" font-size="12" font-family="monospace">Quantified claims</text>
    <text x="350" y="170" text-anchor="middle" fill="#a0a0c0" font-size="12" font-family="monospace">Tech choices</text>
    <text x="350" y="190" text-anchor="middle" fill="#a0a0c0" font-size="12" font-family="monospace">Vague areas</text>
    <text x="350" y="210" text-anchor="middle" fill="#a0a0c0" font-size="12" font-family="monospace">Stack trade-offs</text>
  </g>
  <!-- Arrow 2 -->
  <g>
    <line x1="440" y1="160" x2="490" y2="160" stroke="#3a7bd5" stroke-width="2" stroke-dasharray="6,4"/>
    <polygon points="490,154 502,160 490,166" fill="#3a7bd5"/>
  </g>
  <!-- Step 3: Generate -->
  <g filter="url(#shadow)">
    <rect x="510" y="80" width="160" height="160" rx="12" fill="#16213e" stroke="#ff5858" stroke-width="2"/>
    <rect x="510" y="80" width="160" height="36" rx="12" fill="url(#g3)"/>
    <rect x="510" y="104" width="160" height="12" fill="url(#g3)"/>
    <text x="590" y="105" text-anchor="middle" fill="white" font-size="14" font-weight="700" font-family="system-ui">Generate Q's</text>
    <text x="590" y="145" text-anchor="middle" fill="#a0a0c0" font-size="11" font-family="monospace">Warm-up (1-2)</text>
    <text x="590" y="165" text-anchor="middle" fill="#a0a0c0" font-size="11" font-family="monospace">Technical (5-8)</text>
    <text x="590" y="185" text-anchor="middle" fill="#a0a0c0" font-size="11" font-family="monospace">Project (3-5)</text>
    <text x="590" y="205" text-anchor="middle" fill="#a0a0c0" font-size="11" font-family="monospace">Design (1-2)</text>
    <text x="590" y="225" text-anchor="middle" fill="#a0a0c0" font-size="11" font-family="monospace">Behavioral (2-3)</text>
  </g>
  <!-- Arrow 3 -->
  <g>
    <line x1="680" y1="160" x2="730" y2="160" stroke="#ff5858" stroke-width="2" stroke-dasharray="6,4"/>
    <polygon points="730,154 742,160 730,166" fill="#ff5858"/>
  </g>
  <!-- Step 4: Output -->
  <g filter="url(#shadow)">
    <rect x="750" y="80" width="120" height="160" rx="12" fill="#16213e" stroke="#38ef7d" stroke-width="2"/>
    <rect x="750" y="80" width="120" height="36" rx="12" fill="url(#g4)"/>
    <rect x="750" y="104" width="120" height="12" fill="url(#g4)"/>
    <text x="810" y="105" text-anchor="middle" fill="white" font-size="14" font-weight="700" font-family="system-ui">Output</text>
    <text x="810" y="148" text-anchor="middle" fill="#a0a0c0" font-size="24" font-family="monospace">.md</text>
    <text x="810" y="180" text-anchor="middle" fill="#a0a0c0" font-size="11" font-family="monospace">Structured</text>
    <text x="810" y="198" text-anchor="middle" fill="#a0a0c0" font-size="11" font-family="monospace">Categorized</text>
    <text x="810" y="216" text-anchor="middle" fill="#a0a0c0" font-size="11" font-family="monospace">Follow-ups</text>
  </g>
  <!-- Bottom bar -->
  <text x="450" y="290" text-anchor="middle" fill="#667eea" font-size="13" font-family="system-ui" font-weight="600" opacity="0.7">
    Difficulty: Junior | Mid | Senior  ·  Role: LLM | CV | NLP | Backend
  </text>
</svg>
